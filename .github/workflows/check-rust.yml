name: check-rust

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  check-rust:
    strategy:
      fail-fast: false
      matrix:
        # Native surface is Windows-only (NTFS MFT / USN). Keep Ubuntu for the
        # portable core. Skip macOS: GitHub arm64 runners queue for tens of
        # minutes and cancel the whole check-rust run as failure.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v5
      # Reads rust-toolchain.toml so CI cannot drift from the pinned channel.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # No Linux system-library step: the shared WAE Linux backend loads
      # WebKitGTK 4.1 at runtime through libloading, so it has no build-time
      # pkg-config dependency in this skeleton.
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
