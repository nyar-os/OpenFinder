[workspace]
resolver = "2"
members = ["crates/core", "crates/napi"]
default-members = ["crates/core", "crates/napi"]
exclude = ["projects"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenFinder Authors"]
repository = "https://github.com/nyar-os/OpenFinder"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
# Cross-repo git dependencies must pin the full 40-character revision.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "62ed053e7b3d48cad3c4d5a08d06bbf30377a242" }
# Traversal kernel shared with OpenCleaner.
boost-fs = { git = "https://github.com/oovm/rust-boost", rev = "08c38294d7943686675f34b26088a2705e93184f" }
open-finder-core = { path = "crates/core", version = "0.0.1" }

[profile.release]
lto = true
panic = "abort"
