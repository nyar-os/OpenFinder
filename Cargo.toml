[workspace]
resolver = "2"
members = ["crates/core", "crates/napi"]
default-members = ["crates/core", "crates/napi"]
exclude = ["projects"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenFinder Authors"]
repository = "https://github.com/nyar-os/OpenFinder"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
# Cross-repo git dependencies must pin the full 40-character revision.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "a2cb0056482b5b113a82b06367ef4369ec141c0d" }
open-finder-core = { path = "crates/core", version = "0.0.0" }

[profile.release]
lto = true
panic = "abort"
